<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VOID PDF Processor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root { color-scheme: light dark; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f5f7fa;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #333;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 20px;
      z-index: 5;
      position: relative;
    }

    /* DROPZONE */
    #dropzone {
      border: 3px dashed #0078d4;
      border-radius: 12px;
      padding: 40px 24px;
      background: #ffffff;
      color: #0078d4;
      font-size: 18px;
      font-weight: 600;
      transition: 0.25s ease;
    }

    #dropzone:hover { background: #eef6ff; }

    /* --------------------------- */
    /* TEXT-ONLY DARK MODE BUTTON  */
    /* --------------------------- */
    #themeButton {
      position: fixed;
      top: 40px;
      left: 40px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 2px solid #0078d4;
      background: white;
      color: #0078d4;
      font-weight: 600;
      cursor: pointer;
      z-index: 9999;
    }

    html.dark #themeButton {
      background: #0078d4;
      color: white;
      border-color: #005a9e;
    }

    /* --------------------------- */
    /* ANDY BUTTON                 */
    /* --------------------------- */
    #andyButton {
      position: fixed;
      top: 40px;
      right: 40px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 2px solid #ffa600;
      background: #fff6da;
      font-weight: 700;
      cursor: pointer;
      z-index: 9999;
    }

    #andyButton.active {
      background: #ffa600;
      color: white;
    }

    /* --------------------------------------------- */
    /* DARK MODE OVERRIDES                           */
    /* --------------------------------------------- */
    html.dark body {
      background: #1e1e1e;
      color: #e0e0e0;
    }

    /* Dropzone in dark mode */
    html.dark #dropzone {
      background: #2a2a2a !important;
      color: #66aaff !important;
      border-color: #66aaff !important;
    }

    html.dark #dropzone:hover {
      background: #333 !important;
    }

    /* --------------------------------------------- */
    /* POWERMAN ANDY MODE — ALWAYS OVERRIDES DARK    */
    /* --------------------------------------------- */
    html.powerman-andy body {
      background-image:
        url("image.png"),
        url("image.png"),
        url("image.png") !important;

      background-size: 250px;
      background-repeat: repeat;
      background-position: 0 0, 125px 125px, 250px 250px;

      /* Powerman Andy should ALWAYS win */
      background-color: #111 !important;
      color: #fff !important;
    }

    /* KEEP TEXT LAYER EVEN IN DARK MODE */
    html.powerman-andy body::before {
      content: "I LOVE POWER • SCOTTISH POWER NO.1 FAN • WHEN I AM BORED AT THE WEEKENDS I CALL SCOTTISH POWER • ";
      position: fixed;
      inset: 0;
      z-index: 1;
      font-size: 38px;
      font-weight: 900;
      color: rgba(255,255,255,0.08);
      writing-mode: vertical-rl;
      text-orientation: upright;
      pointer-events:none;
    }

    /* Keep app UI ABOVE Power layer */
    body > * {
      position: relative;
      z-index: 5;
    }
  </style>
</head>

<body>

  <!-- THEME TOGGLE -->
  <button id="themeButton">DARK MODE</button>

  <!-- ANDY TOGGLE -->
  <button id="andyButton">POWERMAN ANDY</button>

  <div class="container">
    <h1>VOID Pack & Work Order Processor</h1>
    <p class="subtitle">Drag PDFs/ZIPs into the box to build a queue. Press <strong>Go</strong> when ready.</p>

    <div id="dropzone">Drag & Drop PDF or ZIP Here</div>

    <div id="queueControls">
      <button id="processBtn">Go</button>
      <button id="clearBtn">Clear</button>
      <div id="queueList"></div>
    </div>
  </div>

  <!-- LIBRARIES -->
  <script type="module">
    import * as pdfjsLib from './pdf.mjs';
    window.pdfjsLib = pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';
  </script>

  <script src="./jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./pdf-lib.min.js"></script>
  <script src="./script.js"></script>

  <!-- LOGIC -->
  <script>
    const root = document.documentElement;
    const themeButton = document.getElementById("themeButton");
    const andyButton = document.getElementById("andyButton");

    /* ----------- DARK MODE LOGIC ----------- */
    if (localStorage.getItem("theme") === "dark") {
      root.classList.add("dark");
      themeButton.textContent = "LIGHT MODE";
    }

    themeButton.addEventListener("click", () => {
      const isDark = root.classList.toggle("dark");
      themeButton.textContent = isDark ? "LIGHT MODE" : "DARK MODE";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    /* ----------- ANDY MODE LOGIC ----------- */
    if (localStorage.getItem("powerman-andy") === "on") {
      root.classList.add("powerman-andy");
      andyButton.classList.add("active");
    }

    andyButton.addEventListener("click", () => {
      const on = root.classList.toggle("powerman-andy");
      andyButton.classList.toggle("active", on);
      localStorage.setItem("powerman-andy", on ? "on" : "off");
    });
  </script>

</body>
</html>
