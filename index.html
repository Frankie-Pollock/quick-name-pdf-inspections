<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VOID PDF Processor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root { color-scheme: light dark; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f5f7fa;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #333;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
      color: #1f1f1f;
    }

    p.subtitle {
      margin: 0 0 18px;
      font-size: 15px;
      color: #555;
    }

    /* Dropzone */
    #dropzone {
      border: 3px dashed #0078d4;
      border-radius: 12px;
      padding: 40px 24px;
      background: #ffffff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 500;
      color: #0078d4;
      transition: 0.25s ease;
      user-select: none;
    }

    #dropzone:hover {
      background: #eef6ff;
      border-color: #005a9e;
    }

    #dropzone.dragging {
      background: #e1f0ff;
      border-color: #005a9e;
    }

    /* Queue controls */
    #queueControls { margin-top: 14px; }

    #processBtn {
      background:#0078d4;
      color:#fff;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      cursor:pointer;
      margin-right:8px;
      font-weight:600;
    }

    #clearBtn {
      background:#ccc;
      color:#000;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      cursor:pointer;
    }

    #queueList {
      margin-top: 10px;
      font-size: 13px;
      text-align: left;
    }

    .queue-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:6px 10px;
      border:1px solid #e5e5e5;
      border-radius:6px;
      margin-bottom:6px;
      background:#fff;
    }

    .queue-name {
      max-width:75%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .rm-btn {
      background:#eee;
      border:1px solid #ddd;
      color:#333;
      padding:3px 8px;
      border-radius:4px;
      cursor:pointer;
    }

    /* ──────────────────────────────────────────────── */
    /* LIGHT / DARK MODE BUTTON                         */
    /* ──────────────────────────────────────────────── */

    .mode-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      background: #ffffff;
      border: 2px solid #ccc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      transition: 0.25s ease;
      z-index: 9999;
    }

    .mode-btn:hover {
      background: #e7e7e7;
    }

    /* Dark Theme */
    html.dark body {
      background: #1e1e1e;
      color: #dcdcdc;
    }

    html.dark #dropzone {
      background: #2a2a2a;
      color: #66aaff;
      border-color: #66aaff;
    }

    html.dark #dropzone:hover {
      background: #333;
      border-color: #99c4ff;
    }

    html.dark .queue-item {
      background: #2a2a2a;
      border-color: #444;
    }

    html.dark #processBtn {
      background: #005a9e;
    }

    html.dark #clearBtn {
      background: #444;
      color: #fff;
    }

    html.dark .mode-btn {
      background: #333;
      border-color: #666;
      color: #fff;
    }
  </style>
</head>

<body>

  <!-- 🔆 DARK MODE TOGGLE BUTTON -->
  <button id="modeToggle" class="mode-btn">🌙</button>

  <div class="container">
    <h1>VOID Pack & Work Order Processor</h1>
    <p class="subtitle">Drag PDFs/ZIPs into the box to build a queue. Press <strong>Go</strong> when ready.</p>

    <!-- SINGLE dropzone -->
    <div id="dropzone">Drag & Drop PDF or ZIP Here</div>

    <!-- Queue controls -->
    <div id="queueControls">
      <button id="processBtn">Go</button>
      <button id="clearBtn">Clear</button>
      <div id="queueList"></div>
    </div>
  </div>

  <!-- PDF.js -->
  <script type="module">
    import * as pdfjsLib from './pdf.mjs';
    window.pdfjsLib = pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';
  </script>

  <!-- JSZip -->
  <script src="./jszip.min.js"></script>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract  ./pdf-lib.min.js</script>

  <!-- Main app logic -->
  <script src="./script.js"></script>

  <!-- Dark Mode + localStorage -->
  <script>
    const toggleBtn = document.getElementById("modeToggle");

    // --- Load saved preference ---
    const savedMode = localStorage.getItem("theme");
    if (savedMode === "dark") {
      document.documentElement.classList.add("dark");
      toggleBtn.textContent = "☀️";
    } else {
      toggleBtn.textContent = "🌙";
    }

    // --- Toggle + Save ---
    toggleBtn.addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");

      toggleBtn.textContent = isDark ? "☀️" : "🌙";

      localStorage.setItem("theme", isDark ? "dark" : "light");
    });
  </script>

</body>
</html>
