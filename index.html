<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VOID PDF Processor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root { color-scheme: light dark; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
      color: #1f1f1f;
    }

    p.subtitle {
      margin: 0 0 28px;
      font-size: 15px;
      color: #555;
    }

    /* Drag zone */
    #dropzone {
      border: 3px dashed #0078d4;
      border-radius: 12px;
      padding: 50px 30px;
      background: #ffffff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 500;
      color: #0078d4;
      transition: 0.25s ease;
    }

    #dropzone:hover {
      background: #eef6ff;
      border-color: #005a9e;
    }

    #dropzone.dragging {
      background: #e1f0ff;
      border-color: #005a9e;
    }

    /* Hide old wizard completely */
    #wizard {
      display: none !important;
      visibility: hidden !important;
    }

    /* Hide the unused address field */
    #address {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>VOID Pack & Work Order Processor</h1>
  <p class="subtitle">Drop an Inspection Pack or Work Orders here — processing will run automatically.</p>

  <div id="dropzone">
    Drag &amp; Drop PDF or ZIP Here
  </div>
</div>

  <!-- Queue Controls -->
<div id="queueControls" style="margin:12px 0; font-family:system-ui,Segoe UI,Arial,sans-serif">
  <input id="filePicker" type="file" multiple accept=".pdf,.zip" style="margin-right:8px" />
  <button id="processBtn" style="background:#0078d4;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;margin-right:6px">Go</button>
  <button id="clearBtn" style="background:#ccc;color:#000;border:none;padding:6px 12px;border-radius:4px;cursor:pointer">Clear</button>
  <div id="queueList" style="margin-top:10px;font-size:12px;color:#333"></div>
</div>

<!-- Existing Dropzone -->
<div id="dropzone" style="border:2px dashed #aaa; padding:16px; border-radius:8px; text-align:center;">
  Drop PDF(s) or ZIP here (they will be queued). Press “Go” to process.
</div>

<!-- PDF.js ES Module -->
<script type="module">
  import * as pdfjsLib from './pdf.mjs';
  window.pdfjsLib = pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';
</script>

<!-- JSZip -->
<script src="./jszip.min.js"></script>

<!-- Tesseract.js -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- pdf-lib -->
<script src="./pdf-lib.min.js"></script>

<!-- Your final script.js (auto mode) -->
<script src="./script.js"></script>

</body>
</html>
