<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VOID PDF Processor</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root { color-scheme: light dark; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f5f7fa;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #333;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      text-align: center;
      max-width: 700px;
      padding: 20px;
      position: relative;
      z-index: 5;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
    }

    p.subtitle {
      margin: 0 0 18px;
      font-size: 15px;
    }

    #dropzone {
      border: 3px dashed #0078d4;
      border-radius: 12px;
      padding: 40px 24px;
      background: #ffffff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 500;
      color: #0078d4;
      transition: 0.25s ease;
      user-select: none;
    }

    #dropzone:hover {
      background: #eef6ff;
      border-color: #005a9e;
    }

    #queueControls { margin-top: 14px; }

    #processBtn {
      background:#0078d4;
      color:#fff;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      cursor:pointer;
      margin-right:8px;
      font-weight:600;
    }

    #clearBtn {
      background:#ccc;
      color:#000;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      cursor:pointer;
    }

    #queueList {
      margin-top: 10px;
      font-size: 13px;
      text-align: left;
    }

    .queue-item {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:6px 10px;
      border:1px solid #e5e5e5;
      border-radius:6px;
      margin-bottom:6px;
      background:#fff;
    }

    /* ------------------------------------------------------------------ */
    /* FIXED, PERFECT DARK/LIGHT SWITCH                                  */
    /* ------------------------------------------------------------------ */

    .theme-switch {
      position: fixed;
      top: 40px;
      left: 40px;
      width: 56px;
      height: 28px;
      z-index: 9999;
    }

    .theme-switch input {
      display: none;
    }

    .theme-switch .slider {
      background: #ccc;
      border-radius: 34px;
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    .theme-switch .slider::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 2px;
      top: 2px;
      background: white;
      border-radius: 50%;
      transition: transform 0.25s ease;
      z-index: 3;
    }

    .theme-switch .icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .theme-switch .icon.moon {
      left: 8px;
      opacity: 1; /* Light mode: moon visible */
    }

    .theme-switch .icon.sun {
      right: 8px;
      opacity: 0; /* Light mode: sun hidden */
    }

    /* DARK MODE STATE */
    .theme-switch input:checked + .slider {
      background: #4a8fff;
    }

    .theme-switch input:checked + .slider::before {
      transform: translateX(28px);
    }

    .theme-switch input:checked + .slider .icon.moon {
      opacity: 0;
    }

    .theme-switch input:checked + .slider .icon.sun {
      opacity: 1;
    }

    /* Dark mode app UI */
    html.dark body {
      background: #1e1e1e;
      color: #e0e0e0;
    }


    /* ------------------------------------------------------------------ */
    /* POWERMAN ANDY MODE                                                */
    /* ------------------------------------------------------------------ */

    .andy-switch {
      position: fixed;
      top: 40px;
      right: 40px;
      width: 50px;
      height: 28px;
      display: inline-block;
      z-index: 9999;
    }

    .andy-switch input { display: none; }

    .slider-andy {
      background: #ffcf33;
      border-radius: 34px;
      width: 100%;
      height: 100%;
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      transition: background 0.25s ease;
    }

    .andy-switch input:checked + .slider-andy {
      background: #ffa600;
    }

    html.powerman-andy body {
      background-image:
        url("image.png"),
        url("image.png"),
        url("image.png");
      background-size: 250px;
      background-repeat: repeat;
      background-position: 0 0, 125px 125px, 250px 250px;
      color: #fff !important;
      overflow: auto;
    }

    html.powerman-andy body::before {
      content: "I LOVE POWER · SCOTTISH POWER NO.1 FAN · WHEN I AM BORED AT THE WEEKENDS I CALL SCOTTISH POWER · ";
      position: fixed;
      inset: 0;
      z-index: 3;
      font-size: 38px;
      font-weight: 900;
      color: rgba(255,255,255,0.1);
      writing-mode: vertical-rl;
      text-orientation: upright;
      pointer-events:none;
    }

  </style>
</head>

<body>

  <!-- DARK MODE SWITCH -->
  <label class="theme-switch">
    <input type="checkbox" id="modeToggle">
    <span class="slider">
      <span class="icon moon">🌙</span>
      <span class="icon sun">☀️</span>
    </span>
  </label>

  <!-- POWERMAN ANDY MODE SWITCH -->
  <label class="andy-switch">
    <input type="checkbox" id="andyToggle">
    <span class="slider-andy">⚡</span>
  </label>

  <div class="container">
    <h1>VOID Pack & Work Order Processor</h1>
    <p class="subtitle">Drag PDFs/ZIPs into the box to build a queue. Press <strong>Go</strong> when ready.</p>

    <div id="dropzone">Drag & Drop PDF or ZIP Here</div>

    <div id="queueControls">
      <button id="processBtn">Go</button>
      <button id="clearBtn">Clear</button>
      <div id="queueList"></div>
    </div>
  </div>

  <!-- Libraries -->
  <script type="module">
    import * as pdfjsLib from './pdf.mjs';
    window.pdfjsLib = pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';
  </script>

  <script src="./jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./pdf-lib.min.js"></script>
  <script src="./script.js"></script>

  <!-- MODE LOGIC -->
  <script>
    const root = document.documentElement;

    /* Dark Mode */
    const modeToggle = document.getElementById("modeToggle");
    if (localStorage.getItem("theme") === "dark") {
      root.classList.add("dark");
      modeToggle.checked = true;
    }
    modeToggle.addEventListener("change", () => {
      const on = modeToggle.checked;
      root.classList.toggle("dark", on);
      localStorage.setItem("theme", on ? "dark" : "light");
    });

    /* Powerman Andy Mode */
    const andyToggle = document.getElementById("andyToggle");
    if (localStorage.getItem("powerman-andy") === "on") {
      root.classList.add("powerman-andy");
      andyToggle.checked = true;
    }
    andyToggle.addEventListener("change", () => {
      const on = andyToggle.checked;
      root.classList.toggle("powerman-andy", on);
      localStorage.setItem("powerman-andy", on ? "on" : "off");
    });
  </script>

</body>
</html>
